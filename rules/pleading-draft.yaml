# 起诉状要素齐备性核对 规则库
#
# 规则数据与代码分离：替换本文件即可切换规则集版本，无需改动 TypeScript。
#
# 条款引用纪律（由 shared/ruleset.ts 强制校验）：
#   - 每条规则必须写全 document / number / clause / excerpt / kind / source，
#     且 excerpt 必须是逐字摘录，不得改写。
#   - kind: direct                       条款直接规定了所检查的要求
#   - kind: derived-from-principle       条款未直接规定，仅能由原则性条款推论（severity 最多 warn）
#   - kind: institutional-configuration 阈值出自本机构配置（severity 最多 info）
#
# ⚠️⚠️ 本规则库的诚实说明：**excerpt 一律不是引文。**
#   本插件核对的是"起诉状（或申请书）要素核对表"的**齐备性**：
#     每项诉请是否有事实依据、是否指明证据、是否写明法律依据、
#     给付之诉是否写明金额与履行期限、文书是否写明案号与当事人、
#     序号是否唯一、是否残留模板占位符。
#   其规范载体是**《中华人民共和国民事诉讼法》第一百二十二条**关于起诉状应当记明事项的规定、
#   《最高人民法院关于适用〈中华人民共和国民事诉讼法〉的解释》等。
#   **核查未取得这些文件的逐字条文**，故每条 excerpt 如实写明，kind 降为 derived-from-principle（封顶 warn）。
#
# ⚠️⚠️ 另一条**必须保留**的边界：**本插件绝不判定诉请是否成立、
#   是否超过诉讼时效、管辖是否正确、证据是否充分、是否应当立案**。
#   那是法院依法审查与裁判的事项，也是诉讼代理人的实质判断。
#   → 本插件只核对**文书要素的齐备与自洽**，且**它看不到证据与法条本身**：
#     它只核对"是否指明了"，**不核对所指是否属实、是否对应**。

plugin: dsh-pleading-draft
version: "2026.1"

rules:
  - id: PL-001
    title: 每项诉请都应写明事实依据
    severity: warn
    basis:
      document: 《中华人民共和国民事诉讼法》
      number: 1991年通过，经 2007、2012、2017、2021、2023 年五次修正（现行条号据 2021 年第四次修正及 2023 年第五次修正文本核对）
      clause: 第一百二十四条（三）——起诉状应当记明诉讼请求和所根据的事实与理由
      excerpt: 起诉状应当记明下列事项：（一）原告的姓名、性别、年龄、民族、职业、工作单位、住所、联系方式，法人或者其他组织的名称、住所和法定代表人或者主要负责人的姓名、职务、联系方式；（二）被告的姓名、性别、工作单位、住所等信息，法人或者其他组织的名称、住所等信息；（三）诉讼请求和所根据的事实与理由；（四）证据和证据来源，证人姓名和住所。
      kind: direct
      source: http://www.anding.gov.cn/art/2023/11/16/art_19048_1695532.html
    params:
        check:
          kind: presence
          field: fact
          fix: 补填事实依据；本条只核对是否写明，不判断事实是否属实
    note: >-
      ✅ **本条已于 2026-10-07 换为现行文本的逐字引文**（见 rules/evidence/clause-verification-civil-procedure-versions.md）。
      ✅ kind 已升为 direct（2026-10-07）：**现行第一百二十四条第（三）项**逐字要求起诉状记明「**诉讼请求和所根据的事实与理由**」。⚠️ **条号已由 2012 年文本的第一百二十一条更正为现行的第一百二十四条（+3），并经现行文本核对确认。**
      诉请若无事实依据，就无法看出请求从何而来，法院也无从审查。
      本次未取得明文条号，故封顶 warn。
      本条只核对事实依据栏是否填写，**不判断该事实是否属实、是否有证据支持**。

  - id: PL-002
    title: 每项诉请都应指明证据
    severity: warn
    basis:
      document: 《中华人民共和国民事诉讼法》
      number: 1991年通过，经 2007、2012、2017、2021、2023 年五次修正（现行条号据 2021 年第四次修正及 2023 年第五次修正文本核对）
      clause: 第一百二十四条（四）与第六十七条——起诉状应当记明证据和证据来源；当事人对自己提出的主张有责任提供证据
      excerpt: 起诉状应当记明下列事项：（一）原告的姓名、性别、年龄、民族、职业、工作单位、住所、联系方式，法人或者其他组织的名称、住所和法定代表人或者主要负责人的姓名、职务、联系方式；（二）被告的姓名、性别、工作单位、住所等信息，法人或者其他组织的名称、住所等信息；（三）诉讼请求和所根据的事实与理由；（四）证据和证据来源，证人姓名和住所。……当事人对自己提出的主张，有责任提供证据。
      kind: direct
      source: http://www.anding.gov.cn/art/2023/11/16/art_19048_1695532.html
    params:
        check:
          kind: presence
          field: evidence
          fix: 补填证据编号；本条只核对是否指明，不判断证据是否充分
    note: >-
      ✅ **本条已于 2026-10-07 换为现行文本的逐字引文**（见 rules/evidence/clause-verification-civil-procedure-versions.md）。
      ✅ kind 已升为 direct（2026-10-07）：**现行第一百二十四条第（四）项**要求记明「**证据和证据来源，证人姓名和住所**」，**现行第六十七条**规定「当事人对自己提出的主张，有责任提供证据」。⚠️ **条号更正：2012 年第一百二十一条→现行第一百二十四条；2012 年第六十四条→现行第六十七条。**
      诉请与证据的对应关系是庭审的核心：文书中若看不出某项诉请靠哪些证据支撑，
      举证质证就失去了索引。本次未取得明文条号，故封顶 warn。
      ⚠️ **本条只核对"是否指明了证据编号"**——它看不到证据本身，
      **因此它不能判断证据是否充分、是否与诉请对应**。这是它最重要的能力边界。

  - id: PL-003
    title: 每项诉请都应写明法律依据
    severity: warn
    basis:
      document: 《中华人民共和国民事诉讼法》
      number: 1991年通过，经 2007、2012、2017、2021、2023 年五次修正（现行条号据 2021 年第四次修正及 2023 年第五次修正文本核对）
      clause: 第一百二十四条（三）——起诉状应当记明诉讼请求和所根据的事实与理由
      excerpt: 起诉状应当记明下列事项：（一）原告的姓名、性别、年龄、民族、职业、工作单位、住所、联系方式，法人或者其他组织的名称、住所和法定代表人或者主要负责人的姓名、职务、联系方式；（二）被告的姓名、性别、工作单位、住所等信息，法人或者其他组织的名称、住所等信息；（三）诉讼请求和所根据的事实与理由；（四）证据和证据来源，证人姓名和住所。
      kind: direct
      source: http://www.anding.gov.cn/art/2023/11/16/art_19048_1695532.html
    params:
        check:
          kind: presence
          field: law
          fix: 补填法律依据；本条只核对是否写明，不判断法条是否适用
    note: >-
      ✅ **本条已于 2026-10-07 换为现行文本的逐字引文**（见 rules/evidence/clause-verification-civil-procedure-versions.md）。
      ✅ kind 已升为 direct（2026-10-07）：同第一百二十四条第（三）项——「**所根据的事实与理由**」中的"理由"即法律依据。⚠️ **条号已更正为现行第一百二十四条。**
      请求权的法律依据是起诉状的必要内容。本次未取得明文条号，故封顶 warn。
      ⚠️ **本条只核对"是否写了法条"**——它**不校验法条是否存在、是否现行有效、是否适用于本案**。
      法条适用的判断需要法律专业能力，也是诉讼代理人的核心工作，本插件刻意不做。

  - id: PL-004
    title: 给付之诉应写明金额与履行期限
    severity: warn
    basis:
      document: 《中华人民共和国民事诉讼法》
      number: 1991年通过，经 2007、2012、2017、2021、2023 年五次修正（现行条号据 2021 年第四次修正及 2023 年第五次修正文本核对）
      clause: 第一百二十二条（三）——起诉必须符合「有具体的诉讼请求和事实、理由」这一条件
      excerpt: 起诉必须符合下列条件：（一）原告是与本案有直接利害关系的公民、法人和其他组织；（二）有明确的被告；（三）有具体的诉讼请求和事实、理由；（四）属于人民法院受理民事诉讼的范围和受诉人民法院管辖。
      kind: derived-from-principle
      source: http://www.anding.gov.cn/art/2023/11/16/art_19048_1695532.html
    params:
        check:
          kind: conditionalPresence
          conditionField: amount
          requiredFields: ["deadline"]
          conditionValues: []
    note: >-
      ✅ **本条已于 2026-10-07 换为现行文本的逐字引文**（见 rules/evidence/clause-verification-civil-procedure-versions.md）。
      ⚠️ kind 仍为 derived-from-principle：**现行第一百二十二条第（三）项**要求"**有具体的**诉讼请求和事实、理由"，**但并未规定给付之诉必须写明金额与履行期限**——那两项是"具体"的可核对表达。⚠️ **条号已由 2012 年第一百一十九条更正为现行第一百二十二条（+3）。**
      诉请金额与履行期限都是"请求应当明确"的组成部分：金额决定了诉讼标的额与受理费，
      期限决定了判决主文能否执行。本次未取得明文条号，故封顶 warn。
      本条**只在金额栏已填写时**要求期限栏，避免对非给付之诉（确认之诉、形成之诉）报差异。
      本条只核对期限栏是否填写，**不判断金额是否计算正确、期限是否合理**。

  - id: PL-005
    title: 核对表应声明当事人与案由
    severity: warn
    basis:
      document: 《中华人民共和国民事诉讼法》
      number: 1991年通过，经 2007、2012、2017、2021、2023 年五次修正（现行条号据 2021 年第四次修正及 2023 年第五次修正文本核对）
      clause: 第一百二十四条（一）（二）——起诉状应当记明原告与被告的姓名、住所、联系方式等事项
      excerpt: 起诉状应当记明下列事项：（一）原告的姓名、性别、年龄、民族、职业、工作单位、住所、联系方式，法人或者其他组织的名称、住所和法定代表人或者主要负责人的姓名、职务、联系方式；（二）被告的姓名、性别、工作单位、住所等信息，法人或者其他组织的名称、住所等信息；（三）诉讼请求和所根据的事实与理由；（四）证据和证据来源，证人姓名和住所。
      kind: direct
      source: http://www.anding.gov.cn/art/2023/11/16/art_19048_1695532.html
    params:
        check:
          kind: headerPresence
          fields: ["plaintiff","defendant"]
    note: >-
      ✅ **本条已于 2026-10-07 换为现行文本的逐字引文**（见 rules/evidence/clause-verification-civil-procedure-versions.md）。
      ✅ kind 已升为 direct（2026-10-07）：**现行第一百二十四条第（一）（二）项**逐字要求记明原告与被告的姓名、住所、联系方式等信息。⚠️ **条号已更正为现行第一百二十四条。**
      文书若不写明确切的当事人，法院无法确定诉讼主体，也无法送达。
      本次未取得明文条号，故封顶 warn。
      配置项 plaintiff 对应原告，defendant 对应被告。
      若本机构表式还在表头记录案由与受诉法院，把它们加进 fields 即可。

  - id: PL-006
    title: 请求要素序号不应在表内重复
    severity: warn
    basis:
      document: 《中华人民共和国民事诉讼法》
      number: 1991年通过，经 2007、2012、2017、2021、2023 年五次修正（现行条号据 2021 年第四次修正及 2023 年第五次修正文本核对）
      clause: 第一百二十四条（三）——起诉状应当记明诉讼请求和所根据的事实与理由
      excerpt: 起诉状应当记明下列事项：（一）原告的姓名、性别、年龄、民族、职业、工作单位、住所、联系方式，法人或者其他组织的名称、住所和法定代表人或者主要负责人的姓名、职务、联系方式；（二）被告的姓名、性别、工作单位、住所等信息，法人或者其他组织的名称、住所等信息；（三）诉讼请求和所根据的事实与理由；（四）证据和证据来源，证人姓名和住所。
      kind: derived-from-principle
      source: http://www.anding.gov.cn/art/2023/11/16/art_19048_1695532.html
    params:
        check:
          kind: unique
          field: elementNo
    note: >-
      ✅ **本条已于 2026-10-07 换为现行文本的逐字引文**（见 rules/evidence/clause-verification-civil-procedure-versions.md）。
      ⚠️ kind 仍为 derived-from-principle：第一百二十四条要求记明各项事项，**未规定台账的请求要素序号不得重复**。⚠️ **条号已更正为现行第一百二十四条。**
      序号唯一是"每项诉请只被登记一次"的**前提条件**：序号重复会让人无法在庭审中准确指认诉请。
      本次未取得明文条号，故封顶 warn。比较时忽略空白字符。

  - id: PL-007
    title: 诉请栏不应残留未替换的占位符
    severity: warn
    basis:
      document: 《中华人民共和国民事诉讼法》
      number: 1991年通过，经 2007、2012、2017、2021、2023 年五次修正（现行条号据 2021 年第四次修正及 2023 年第五次修正文本核对）
      clause: 第一百二十二条（三）——起诉必须符合「有具体的诉讼请求和事实、理由」这一条件
      excerpt: 起诉必须符合下列条件：（一）原告是与本案有直接利害关系的公民、法人和其他组织；（二）有明确的被告；（三）有具体的诉讼请求和事实、理由；（四）属于人民法院受理民事诉讼的范围和受诉人民法院管辖。
      kind: derived-from-principle
      source: http://www.anding.gov.cn/art/2023/11/16/art_19048_1695532.html
    params:
        check:
          kind: containsAny
          field: claim
          terms: ["【","】","{{","}}","XXX","xxx","待填","待补充","TBD","todo","示例"]
          fix: 诉请应写明具体的请求事项；残留占位符说明文书是照模板抄的
    note: >-
      ✅ **本条已于 2026-10-07 换为现行文本的逐字引文**（见 rules/evidence/clause-verification-civil-procedure-versions.md）。
      ⚠️ kind 仍为 derived-from-principle：第一百二十二条第（三）项**未就占位符作任何规定**。⚠️ **条号已由 2012 年第一百一十九条更正为现行第一百二十二条（+3）。**
      起诉状常由模板复制而来，诉请栏留下【】、XXX、待填、TBD 之类占位符时，
      会让人误以为已经写明了请求——**这是文书类工具最危险的失效方式**。
      本次未取得明文条号，故封顶 warn。
      ⚠️ 本条**不能替代对诉请明确性的实质审查**：措辞含糊但无占位符的诉请，本条不会发现。

disabled: []
